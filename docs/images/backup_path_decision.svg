<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" width="980" height="640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8d98ab"/>
    </marker>
  </defs>
  <rect width="980" height="640" fill="#0e1420"/>
  <text x="40" y="44" fill="#dbe4f0" font-size="22" font-weight="600">What GhostDeck decides at start</text>
  <text x="40" y="68" fill="#8d98ab" font-size="14">One probe of the method interface, then the backup path only where the model's block layout is on record.</text>

  <!-- start -->
  <rect x="330" y="92" width="320" height="56" rx="10" fill="#151d2c" stroke="#46c8ff"/>
  <text x="490" y="116" fill="#dbe4f0" font-size="14" font-weight="600" text-anchor="middle">Probe the method interface (MSI_ACPI)</text>
  <text x="490" y="136" fill="#8d98ab" font-size="12" text-anchor="middle">one read of the firmware version</text>

  <!-- answers -> normal -->
  <path d="M330,120 L190,120 L190,176" fill="none" stroke="#8d98ab" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="258" y="112" fill="#3fb950" font-size="12" font-weight="600" text-anchor="middle">answers</text>
  <rect x="40" y="178" width="300" height="64" rx="10" fill="#12351f" stroke="#3fb950"/>
  <text x="190" y="204" fill="#dbe4f0" font-size="14" font-weight="600" text-anchor="middle">Normal path</text>
  <text x="190" y="226" fill="#8d98ab" font-size="12" text-anchor="middle">every feature of the model's tier, as before</text>

  <!-- refused -> BIOS -->
  <line x1="490" y1="148" x2="490" y2="176" stroke="#8d98ab" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="500" y="168" fill="#f47067" font-size="12" font-weight="600">refused (0x8004100C) or no schema file</text>
  <rect x="330" y="178" width="320" height="64" rx="10" fill="#151d2c" stroke="#26314a"/>
  <text x="490" y="204" fill="#dbe4f0" font-size="14" font-weight="600" text-anchor="middle">Read the BIOS version from SMBIOS</text>
  <text x="490" y="226" fill="#8d98ab" font-size="12" text-anchor="middle">E16W2IMS.105  →  board code 16W2</text>

  <line x1="490" y1="242" x2="490" y2="270" stroke="#8d98ab" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="330" y="272" width="320" height="64" rx="10" fill="#151d2c" stroke="#26314a"/>
  <text x="490" y="298" fill="#dbe4f0" font-size="14" font-weight="600" text-anchor="middle">Exactly one model with a block layout?</text>
  <text x="490" y="320" fill="#8d98ab" font-size="12" text-anchor="middle">board code → one EC line in the database → entry with blockPath</text>

  <!-- yes -> backup path -->
  <path d="M330,304 L190,304 L190,366" fill="none" stroke="#8d98ab" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="258" y="296" fill="#3fb950" font-size="12" font-weight="600" text-anchor="middle">yes, values fit</text>
  <rect x="40" y="368" width="300" height="72" rx="10" fill="#151d2c" stroke="#46c8ff"/>
  <text x="190" y="392" fill="#dbe4f0" font-size="14" font-weight="600" text-anchor="middle">Backup WMI path</text>
  <text x="190" y="412" fill="#8d98ab" font-size="12" text-anchor="middle">profiles, temperatures, fan duty and RPM;</text>
  <text x="190" y="428" fill="#8d98ab" font-size="12" text-anchor="middle">the fan curve where the entry has one (GF65)</text>

  <line x1="190" y1="440" x2="190" y2="468" stroke="#8d98ab" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="40" y="470" width="300" height="56" rx="10" fill="#3a2b10" stroke="#d9a13b"/>
  <text x="190" y="494" fill="#dbe4f0" font-size="14" font-weight="600" text-anchor="middle">Switching locked</text>
  <text x="190" y="514" fill="#8d98ab" font-size="12" text-anchor="middle">a card at start and the tray menu offer the path test</text>

  <line x1="190" y1="526" x2="190" y2="554" stroke="#8d98ab" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="200" y="546" fill="#3fb950" font-size="12" font-weight="600">path test passed</text>
  <rect x="40" y="556" width="300" height="56" rx="10" fill="#12351f" stroke="#3fb950"/>
  <text x="190" y="580" fill="#dbe4f0" font-size="14" font-weight="600" text-anchor="middle">Switching unlocked on this machine</text>
  <text x="190" y="600" fill="#8d98ab" font-size="12" text-anchor="middle">remembered per firmware label</text>

  <!-- no entry -> fingerprint -->
  <line x1="490" y1="336" x2="490" y2="364" stroke="#8d98ab" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="500" y="356" fill="#d9a13b" font-size="12" font-weight="600">no entry (or two EC lines for the code)</text>
  <rect x="330" y="366" width="320" height="64" rx="10" fill="#151d2c" stroke="#26314a"/>
  <text x="490" y="392" fill="#dbe4f0" font-size="14" font-weight="600" text-anchor="middle">Do the blocks show the known layout?</text>
  <text x="490" y="414" fill="#8d98ab" font-size="12" text-anchor="middle">19 / 18 / 21 / 8 instances and four constant markers</text>

  <!-- yes -> monitoring only -->
  <path d="M650,398 L790,398 L790,454" fill="none" stroke="#8d98ab" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="720" y="390" fill="#3fb950" font-size="12" font-weight="600" text-anchor="middle">yes</text>
  <rect x="660" y="456" width="280" height="100" rx="10" fill="#151d2c" stroke="#d9a13b"/>
  <text x="800" y="480" fill="#dbe4f0" font-size="14" font-weight="600" text-anchor="middle">Monitoring only</text>
  <text x="800" y="500" fill="#8d98ab" font-size="12" text-anchor="middle">temperatures, fan duty and RPM;</text>
  <text x="800" y="516" fill="#8d98ab" font-size="12" text-anchor="middle">a card at start points to the Report tab,</text>
  <text x="800" y="532" fill="#8d98ab" font-size="12" text-anchor="middle">"Report my model" captures the blocks per scenario</text>
  <text x="800" y="548" fill="#8d98ab" font-size="12" text-anchor="middle">→ a new entry through the signed database</text>

  <!-- no -> temperatures only -->
  <line x1="490" y1="430" x2="490" y2="458" stroke="#8d98ab" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="500" y="450" fill="#8d98ab" font-size="12" font-weight="600">no</text>
  <rect x="330" y="460" width="320" height="64" rx="10" fill="#151d2c" stroke="#26314a"/>
  <text x="490" y="486" fill="#dbe4f0" font-size="14" font-weight="600" text-anchor="middle">Temperatures only</text>
  <text x="490" y="508" fill="#8d98ab" font-size="12" text-anchor="middle">MSI_CPU[1] and MSI_VGA[1], nothing else is assumed</text>

  <text x="360" y="586" fill="#8d98ab" font-size="12">The fingerprint never unlocks a write: it says where the registers are;</text>
  <text x="360" y="604" fill="#8d98ab" font-size="12">a recipe in the model's entry says what may go into them.</text>
</svg>
